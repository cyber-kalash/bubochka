  <style>
    #main-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Делаем сетку ровно из 3 фиксированных колонок (слева, по центру, справа) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    /* Колонки */
    .gallery-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .gallery-item {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gallery-item:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
	

    /* На мобильных объединяем в одну колонку, чтобы не сжималось */
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
	
@media print {
  @page {
    size: A4 portrait;
    margin: 5mm; /* Минимальные поля */
  }

  /* Прячем всё лишнее */
  .top-tabs,
  .content-header,
  .print-hide,
  #main-content > div:last-child,
  #main-content::after {
    display: none !important;
  }

  /* Сбрасываем ограничения флекс-контейнеров и высоты */
  html, body, .main-container, .content-area, #main-content {
    background: #ffffff !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    display: block !important;
  }

  #main-content {
    max-width: 100% !important;
  }

  /* Настраиваем сетку и УМЕНЬШАЕМ её сильнее */
  .gallery-grid {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 10px !important;
    margin: 0 auto !important;
    width: 100% !important;
    transform: scale(1.0); /* Уменьшаем масштаб */
    transform-origin: top left;
    width: 285%; /* 100% / 0.35 = 285.7% — компенсируем ширину */ 
  }

  .gallery-column {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
    /* Убрали break-inside: avoid, чтобы браузер не переносил колонку целиком */
  }

  .gallery-item {
    box-shadow: none !important;
    border-radius: 4px !important;
    width: 100% !important;
    height: auto !important;
    margin: 0 !important;
  }

  .gallery-item:hover {
    box-shadow: none !important;
    transform: none !important;
  }
  
  a {
    text-decoration: none !important;
  }
}
