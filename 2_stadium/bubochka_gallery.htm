<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Фотогалерея Бубочки — Мемориал</title>
  <link href="../style.css" rel="stylesheet" type="text/css"/>
  <link href="../print.css" rel="stylesheet" type="text/css" media="print"/>
  <script src="../script.js" defer></script>
  <meta charset="utf-8"/>
  <meta name="theme-color" content="#80397b"/>
  <link href="../template/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
  <style>
    #main-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Делаем сетку ровно из 3 фиксированных колонок (слева, по центру, справа) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 25px 0;
    }

    /* Колонки */
    .gallery-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .gallery-item {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .gallery-item:hover {
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* На мобильных объединяем в одну колонку, чтобы не сжималось */
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
